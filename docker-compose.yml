services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_local
      MYSQL_DATABASE: eduadmin
      MYSQL_USER: eduadmin
      MYSQL_PASSWORD: eduadmin_local
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - eduadmin_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_local"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  eduadmin_mysql:
